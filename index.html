<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>PanHub · 全网最全的网盘搜索</title>
    <meta
      name="description"
      content="PanHub：聚合阿里云盘、夸克、百度网盘、115、迅雷等平台的全网最全网盘搜索工具，实时检索分享资源，快速、高效。"
    />
    <meta
      name="keywords"
      content="网盘搜索, 阿里云盘, 夸克, 百度网盘, 115, 迅雷, 资源搜索, 盘搜, panhub, 网盘聚合搜索"
    />
    <meta name="theme-color" content="#111111" />
    <!-- 站点图标 / PWA manifest 统一使用官方 logo（CDN SVG） -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="https://cdn.jsdmirror.com/gh/wu529778790/img.shenzjd.com@master/blog/imgx-20260828-151509-5bk7.svg"
    />
    <link rel="manifest" href="./site.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />

    <script>
      // 首屏即时应用系统深色模式（避免闪白）
      (function () {
        try {
          if (
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches
          ) {
            document.documentElement.classList.add("dark");
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
